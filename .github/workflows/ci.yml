name: CI

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'client/**'
      - 'shared/**'
      - 'scripts/**'
      - 'evaluation-service/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'client/**'
      - 'shared/**'
      - 'scripts/**'
      - 'evaluation-service/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Placeholder values — all external services are mocked in tests. Replace with GitHub Actions secrets once Phase 2+ services are provisioned.
      - name: Test
        run: npm run test
        env:
          PORT: 3000
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost/test
          JWT_ACCESS_SECRET: test_access_secret_for_ci_only_32chars_x
          JWT_REFRESH_SECRET: test_refresh_secret_for_ci_only_32chars_x
          OPENAI_API_KEY: sk-test-placeholder
          PINECONE_API_KEY: test-placeholder
          PINECONE_ENVIRONMENT: us-east-1-aws
          PINECONE_INDEX: heritage-odyssey-test
          ELEVENLABS_API_KEY: test-placeholder
          ELEVENLABS_VOICE_ID: test-placeholder
          GOOGLE_CLIENT_ID: test-google-client-id
          GOOGLE_CLIENT_SECRET: test-google-client-secret
          GOOGLE_REDIRECT_URI: http://localhost:3000/api/auth/google/callback

      # Requires `coverage` script and coverage thresholds configured in vitest.config.ts — wired during Phase 1 implementation.
      - name: Coverage threshold
        run: npm run coverage
        env:
          PORT: 3000
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost/test
          JWT_ACCESS_SECRET: test_access_secret_for_ci_only_32chars_x
          JWT_REFRESH_SECRET: test_refresh_secret_for_ci_only_32chars_x
          OPENAI_API_KEY: sk-test-placeholder
          PINECONE_API_KEY: test-placeholder
          PINECONE_ENVIRONMENT: us-east-1-aws
          PINECONE_INDEX: heritage-odyssey-test
          ELEVENLABS_API_KEY: test-placeholder
          ELEVENLABS_VOICE_ID: test-placeholder
          GOOGLE_CLIENT_ID: test-google-client-id
          GOOGLE_CLIENT_SECRET: test-google-client-secret
          GOOGLE_REDIRECT_URI: http://localhost:3000/api/auth/google/callback

      # Root build script will be defined in Phase 1. This step will verify the full monorepo compiles cleanly.
      - name: Build
        run: npm run build

      # Promptfoo narrative regression suite — gated on vars.E2E_LIVE to avoid spending
      # OpenAI/ElevenLabs credits on every push. Set repository variable E2E_LIVE=true
      # in GitHub Settings → Variables to activate.
      - name: Promptfoo eval
        if: ${{ vars.E2E_LIVE == 'true' }}
        run: npx promptfoo eval --config promptfoo.yaml
        env:
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
          EVAL_BYPASS_TOKEN: ${{ secrets.EVAL_BYPASS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  python-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'evaluation-service/requirements.txt'

      - name: Install dependencies
        run: pip install -r evaluation-service/requirements.txt

      - name: pytest
        run: cd evaluation-service && python -m pytest
        env:
          OPENAI_API_KEY: sk-test-placeholder
